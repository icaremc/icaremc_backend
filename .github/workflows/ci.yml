name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Code & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Validate Python syntax (Bytecode compilation)
        run: uv run python -m compileall app/ tests/

  test:
    name: Test Suite (Pytest + PostgreSQL)
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: app_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PostgreSQL client (psql)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run test suite
        env:
          DATABASE_URL: postgresql+asyncpg://app_user:password@localhost:5432/app_db_test
          JWT_SECRET: test-jwt-secret-at-least-32-bytes!!
          ENVIRONMENT: 1
          SMS_OTP_DEV_CODE: "123456"
        run: uv run pytest -v

  docker-check:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Dockerfile.staging build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.staging
          push: false
          tags: icaremc-backend:staging-check
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate Dockerfile.prod build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          push: false
          tags: icaremc-backend:prod-check
          cache-from: type=gha
          cache-to: type=gha,mode=max

