options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # Build and push Docker image.
  - name: gcr.io/cloud-builders/docker
    id: Build and Push Docker image
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        docker build -f Dockerfile.prod \
          -t "${_IMAGE_URI}:${SHORT_SHA}" \
          -t "${_IMAGE_URI}:latest" \
          .
        docker push "${_IMAGE_URI}:${SHORT_SHA}"
        docker push "${_IMAGE_URI}:latest"

  # Deploy to Cloud Run using the pushed image.
  - name: gcr.io/cloud-builders/gcloud
    id: Deploy Cloud Run
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        gcloud run deploy "${_SERVICE}" \
          --image "${_IMAGE_URI}:${SHORT_SHA}" \
          --region "${_REGION}" \
          --platform managed \
          --port 8000 \
          --quiet \
          --set-env-vars "ENVIRONMENT=4" \
          --set-secrets=DATABASE_URL=PRODUCTION_DATABASE_URL:latest \
          --set-secrets=JWT_SECRET=JWT_SECRET:latest \
          --set-secrets=JWT_ALGORITHM=JWT_ALGORITHM:latest \
          --set-secrets=JWT_ACCESS_EXPIRE_MINUTES=JWT_ACCESS_EXPIRE_MINUTES:latest \
          --set-secrets=CORS_ALLOWED_ORIGINS=CORS_ALLOWED_ORIGINS:latest

substitutions:
  _REGION: europe-west3
  _REPOSITORY: icaremc-backend
  _IMAGE: icaremc-backend
  _SERVICE: icaremc-backend-prod
  _IMAGE_URI: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}

images:
  - "${_IMAGE_URI}:${SHORT_SHA}"
  - "${_IMAGE_URI}:latest"
